[project]
name = "brei"
version = "0.2.4"
description = "A minimal build system."
authors = [{ name = "Johan Hidding", email = "j.hidding@esciencecenter.nl" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "rich>=13.6.0,<14",
    "rich-argparse>=1.3.0,<2",
    "argh>=0.30.2,<0.31",
]

[project.scripts]
brei = "brei.cli:cli"

[dependency-groups]
dev = [
    "pytest>=7.4.2,<8",
    "hypothesis>=6.88.1,<7",
    "mypy>=1.6.1,<2",
    "pytest-asyncio>=0.21.1,<0.22",
    "deadcode>=2.2.2,<3",
    "pytest-timeout>=2.2.0,<3",
    "coverage>=7.3.2,<8",
    "pyright>=1.1.333,<2",
    "pdoc>=14.1.0,<15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
packages = ["brei"]

[tool.brei]
include = ["docs/weave.toml"]

[[tool.brei.task]]
name = "test"
requires = ["#coverage-report", "#mypy"]

[[tool.brei.task]]
description = "Print coverage info"
name = "coverage-report"
requires = ["coverage.xml"]
script = "coverage report"

[[tool.brei.task]]
description = "Write coverage report to XML"
creates = ["coverage.xml"]
requires = [".coverage"]
script = "coverage xml"

[[tool.brei.task]]
creates = [".coverage"]
requires = ["brei"]
description = "Run tests"
script = "coverage run --source=brei -m pytest"

[[tool.brei.task]]
name = "mypy"
description = "The MyPy static type checker"
script = "mypy"

[[tool.brei.task]]
name = "serve"
description = "Serve and watch for changes"
runner = "bash"
script = """
while true; do
	inotifywait -e close_write docs/*.md docs/template
	brei weave
done
"""

[[tool.brei.task]]
requires = ["coverage.xml"]
stdout = "docs/test_coverage.md"
script = "coverage report --format=markdown"

[[tool.brei.task]]
name = "weave"
requires = ["#html", "#static", "#pdoc"]

[[tool.brei.call]]
template = "pandoc"
collect = "html"
[tool.brei.call.args]
basename = [
  "index",
  "implementation",
  "tasks",
  "lazy",
  "template_strings",
  "program",
]

[[tool.brei.task]]
name = "pdoc"
description = "Build API documentation"
creates = ["docs/site/api/brei.html"]
requires = ["brei/__init__.py"]
script = "pdoc brei -o ./docs/site/api"
